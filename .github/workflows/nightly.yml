name: nightly

on:
  schedule:
    - cron: "0 8 * * *" # daily at 08:00 UTC
  workflow_dispatch:

permissions:
  actions: read
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  check-status:
    name: check status
    runs-on: ubuntu-latest
    steps:
      - name: Require successful check workflow for published commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          for attempt in $(seq 1 30); do
            run="$(gh run list \
              -R "$GITHUB_REPOSITORY" \
              --workflow check.yml \
              --commit "$GITHUB_SHA" \
              --json databaseId,status,conclusion,url \
              --jq '.[0] // empty')"

            if [ -z "$run" ]; then
              echo "No check workflow run found yet for $GITHUB_SHA (attempt $attempt/30)."
              sleep 20
              continue
            fi

            status="$(printf '%s\n' "$run" | jq -r '.status')"
            conclusion="$(printf '%s\n' "$run" | jq -r '.conclusion // ""')"
            url="$(printf '%s\n' "$run" | jq -r '.url')"
            echo "check workflow for $GITHUB_SHA: status=$status conclusion=${conclusion:-pending} url=$url"

            if [ "$status" != "completed" ]; then
              sleep 20
              continue
            fi

            if [ "$conclusion" = "success" ]; then
              exit 0
            fi

            echo "Refusing to publish nightly because check workflow concluded: $conclusion" >&2
            exit 1
          done

          echo "Timed out waiting for successful check workflow for exact published commit $GITHUB_SHA" >&2
          exit 1

  build:
    name: build (${{ matrix.target }})
    needs: check-status
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            cross: false
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-latest
            cross: true
          - target: aarch64-apple-darwin
            runner: macos-latest
            cross: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Add cross target
        if: matrix.cross
        run: rustup target add ${{ matrix.target }}

      - name: Install cargo-zigbuild
        if: matrix.cross
        run: |
          python3 -m pip install ziglang==0.15.2
          mkdir -p "$HOME/.local/bin"
          ln -sf "$(python3 -c 'import shutil; print(shutil.which("python-zig"))')" "$HOME/.local/bin/zig"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          cargo install cargo-zigbuild

      - name: Set build metadata
        run: |
          {
            echo "NMUX_BUILD_CHANNEL=nightly"
            echo "NMUX_BUILD_COMMIT=$GITHUB_SHA"
            echo "NMUX_BUILD_DATE=$(date -u +%Y-%m-%d)"
          } >> "$GITHUB_ENV"

      - name: Build (native)
        if: "!matrix.cross"
        run: cargo build --release -p nmux-cli --bin nmux

      - name: Build (cross)
        if: matrix.cross
        run: cargo zigbuild --release -p nmux-cli --bin nmux --target ${{ matrix.target }}

      - name: Verify static Ghostty linkage
        run: |
          set -euo pipefail

          if [ "${{ matrix.cross }}" = "true" ]; then
            target_dir="target/${{ matrix.target }}/release"
          else
            target_dir="target/release"
          fi
          bin="$target_dir/nmux"
          test -x "$bin"

          dep_report="dynamic-dependencies-${{ matrix.target }}.txt"
          if command -v otool >/dev/null 2>&1; then
            otool -L "$bin" > "$dep_report"
          elif command -v readelf >/dev/null 2>&1; then
            readelf -d "$bin" > "$dep_report" 2>&1 || true
          elif command -v ldd >/dev/null 2>&1; then
            ldd "$bin" > "$dep_report"
          else
            echo "dynamic dependency inspector unavailable" > "$dep_report"
          fi
          cat "$dep_report"

          if grep -Eiq 'libghostty-vt|ghostty-install|libghostty' "$dep_report"; then
            echo "Release artifact dynamically depends on libghostty-vt" >&2
            exit 1
          fi

      - name: Package
        run: |
          set -euo pipefail

          if [ "${{ matrix.cross }}" = "true" ]; then
            target_dir="target/${{ matrix.target }}/release"
          else
            target_dir="target/release"
          fi
          bin="$target_dir/nmux"
          staging="nmux-${{ matrix.target }}"
          rm -rf "$staging"
          mkdir -p "$staging"
          cp "$bin" "$staging/nmux"
          cp "dynamic-dependencies-${{ matrix.target }}.txt" "$staging/DYNAMIC_DEPENDENCIES.txt"
          version="$(awk -F '"' '/^version = / { print $2; exit }' crates/nmux-cli/Cargo.toml)"
          printf '{"binary":"nmux","version":"%s","channel":"%s","commit":"%s","build_date":"%s"}\n' \
            "$version" "$NMUX_BUILD_CHANNEL" "$NMUX_BUILD_COMMIT" "$NMUX_BUILD_DATE" \
            > "$staging/VERSION.json"

          hash_file() {
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum "$1" | awk '{print $1}'
            else
              shasum -a 256 "$1" | awk '{print $1}'
            fi
          }

          {
            echo "nmux nightly artifact provenance"
            echo "generated_at_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "target=${{ matrix.target }}"
            echo "github_repository=$GITHUB_REPOSITORY"
            echo "github_sha=$GITHUB_SHA"
            echo "github_run_id=$GITHUB_RUN_ID"
            echo "github_run_attempt=$GITHUB_RUN_ATTEMPT"
            echo "build_channel=$NMUX_BUILD_CHANNEL"
            echo "build_commit=$NMUX_BUILD_COMMIT"
            echo "build_date=$NMUX_BUILD_DATE"
            echo "binary=nmux"
            echo "artifact_shape=single binary plus checksums and provenance"
            echo "terminal_engine=libghostty-vt"
            echo "terminal_engine_status=default"
            echo "runtime_library_strategy=static libghostty-vt link; no bundled libghostty-vt runtime library"
            echo "static_ghostty_link=verified"
            echo
            echo "[version_json]"
            cat "$staging/VERSION.json"
            echo
            echo "[dynamic_dependencies]"
            cat "$staging/DYNAMIC_DEPENDENCIES.txt"
          } > "$staging/PROVENANCE.txt"

          (
            cd "$staging"
            for file in nmux VERSION.json DYNAMIC_DEPENDENCIES.txt PROVENANCE.txt; do
              printf '%s  %s\n' "$(hash_file "$file")" "$file"
            done > SHA256SUMS
          )

          tar czf "$staging.tar.gz" "$staging"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: nmux-${{ matrix.target }}
          path: nmux-${{ matrix.target }}.tar.gz
          if-no-files-found: error

  release:
    name: release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate checksums
        working-directory: artifacts
        run: sha256sum *.tar.gz > SHA256SUMS

      - name: Create or update nightly release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="nightly"
          # Delete existing release if present
          gh release delete "$tag" --yes 2>/dev/null || true
          # Delete existing tag if present
          git push origin ":refs/tags/$tag" 2>/dev/null || true
          # Create new release
          gh release create "$tag" \
            --title "Nightly ($(date -u +%Y-%m-%d))" \
            --notes "Automated nightly build from \`main\` at $(git rev-parse --short HEAD).

          **This is a development build — not a stable release.**

          Targets:
          - \`x86_64-unknown-linux-gnu\` — Linux x86_64
          - \`aarch64-unknown-linux-gnu\` — Linux ARM64
          - \`aarch64-apple-darwin\` — macOS Apple Silicon" \
            --prerelease \
            artifacts/*
