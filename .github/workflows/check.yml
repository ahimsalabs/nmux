name: check

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  default-engine:
    name: default engine (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner:
          - ubuntu-latest
          - macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Cache Cargo build state
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/git
            ~/.cargo/registry
            target
          key: nmux-${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            nmux-${{ runner.os }}-cargo-
      - name: Source audit
        run: |
          system="$(nix eval --impure --raw --expr builtins.currentSystem)"
          out="$(nix build ".#checks.${system}.source-audit" --no-link --print-out-paths)"
          cat "$out/source-audit.txt"
      - name: Toolchain info
        run: nix develop . -c make toolchain-info
      - name: Check
        run: nix develop . -c make check
      - name: Local smoke
        run: nix develop . -c make local-smoke

  native-vt-opt-in:
    name: native VT opt-in
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Cache Cargo build state
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/git
            ~/.cargo/registry
            target
          key: nmux-${{ runner.os }}-cargo-native-vt-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            nmux-${{ runner.os }}-cargo-native-vt-
      - name: Toolchain info
        run: nix develop . -c make toolchain-info
      - name: Check ghostty VT
        run: nix develop . -c make check-ghostty-vt

  promotion-evidence-bundle:
    name: promotion evidence bundle
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Promotion evidence bundle
        run: nix develop . -c make promotion-evidence-bundle
      - name: Upload promotion evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nmux-promotion-evidence
          path: target/promotion-evidence
          if-no-files-found: error

  promotion-evidence-artifact-verify:
    name: promotion evidence artifact verify
    if: github.event_name == 'workflow_dispatch'
    needs: promotion-evidence-bundle
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Download promotion evidence
        uses: actions/download-artifact@v4
        with:
          name: nmux-promotion-evidence
          path: target/downloaded-promotion-evidence
      - name: Verify downloaded promotion evidence
        run: nix develop . -c make PROMOTION_EVIDENCE_DIR=target/downloaded-promotion-evidence promotion-evidence-verify
