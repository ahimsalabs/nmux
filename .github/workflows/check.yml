name: check

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  change-scope:
    name: change scope
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.scope.outputs.docs_only }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Classify changed paths
        id: scope
        shell: bash
        run: |
          set -euo pipefail
          docs_only=false
          zero_sha="0000000000000000000000000000000000000000"

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
          elif [ "${{ github.event_name }}" = "push" ] && [ "${{ github.event.before }}" != "$zero_sha" ]; then
            base="${{ github.event.before }}"
          else
            base=""
          fi

          if [ -n "$base" ]; then
            if ! git cat-file -e "$base^{commit}" 2>/dev/null; then
              git fetch --no-tags --depth=1 origin "$base" || base=""
            fi
          fi

          if [ -n "$base" ] && git cat-file -e "$base^{commit}" 2>/dev/null; then
            changed="$(git diff --name-only "$base" "$GITHUB_SHA")"
            if [ -n "$changed" ] && ! printf '%s\n' "$changed" | grep -Ev '^(README\.md|WORK\.md|AGENTS\.md|docs/.*\.md)$' >/dev/null; then
              docs_only=true
            fi
          fi

          printf 'docs_only=%s\n' "$docs_only" >> "$GITHUB_OUTPUT"
          printf 'docs_only=%s\n' "$docs_only"

  docs-fast:
    name: docs fast path
    needs: change-scope
    if: needs.change-scope.outputs.docs_only == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Cache Nix build state
        uses: DeterminateSystems/magic-nix-cache-action@v13
        with:
          use-flakehub: false
          diagnostic-endpoint: ""
      - name: Source audit
        run: |
          system="$(nix eval --impure --raw --expr builtins.currentSystem)"
          out="$(nix build ".#checks.${system}.source-audit" --no-link --print-out-paths)"
          cat "$out/source-audit.txt"

  default-engine:
    name: default engine (${{ matrix.runner }})
    needs: change-scope
    if: needs.change-scope.outputs.docs_only != 'true'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner:
          - ubuntu-latest
          - macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Cache Nix build state
        uses: DeterminateSystems/magic-nix-cache-action@v13
        with:
          use-flakehub: false
          diagnostic-endpoint: ""
      - name: Cache Cargo build state
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/git
            ~/.cargo/registry
            target
          key: nmux-${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            nmux-${{ runner.os }}-cargo-
      - name: Source audit
        run: |
          system="$(nix eval --impure --raw --expr builtins.currentSystem)"
          out="$(nix build ".#checks.${system}.source-audit" --no-link --print-out-paths)"
          cat "$out/source-audit.txt"
      - name: Toolchain info
        run: nix develop . -c make toolchain-info
      - name: Check
        run: nix develop . -c make check
      - name: Static link verification
        run: nix develop . -c make static-link-verify
      - name: Local smoke
        run: nix develop . -c make local-smoke

  interim:
    name: interim / no-default-features
    needs: change-scope
    if: needs.change-scope.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Cache Nix build state
        uses: DeterminateSystems/magic-nix-cache-action@v13
        with:
          use-flakehub: false
          diagnostic-endpoint: ""
      - name: Cache Cargo build state
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/git
            ~/.cargo/registry
            target
          key: nmux-${{ runner.os }}-cargo-interim-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            nmux-${{ runner.os }}-cargo-interim-
      - name: Toolchain info
        run: nix develop . -c make toolchain-info
      - name: Check interim
        run: nix develop . -c make check-interim

  promotion-evidence-bundle:
    name: promotion evidence bundle
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Promotion evidence bundle
        run: nix develop . -c make promotion-evidence-bundle
      - name: Upload promotion evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nmux-promotion-evidence
          path: target/promotion-evidence
          if-no-files-found: error

  promotion-evidence-artifact-verify:
    name: promotion evidence artifact verify
    if: github.event_name == 'workflow_dispatch'
    needs: promotion-evidence-bundle
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Download promotion evidence
        uses: actions/download-artifact@v4
        with:
          name: nmux-promotion-evidence
          path: target/downloaded-promotion-evidence
      - name: Verify downloaded promotion evidence
        run: nix develop . -c make PROMOTION_EVIDENCE_DIR=target/downloaded-promotion-evidence promotion-evidence-verify
