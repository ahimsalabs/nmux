[workspace]
members = [
  "crates/nmux-cli",
  "crates/nmux-core",
  "crates/nmux-proto",
  "crates/xtask",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ahimsalabs/nmux"

[workspace.dependencies]
flatbuffers = "=25.12.19"
libc = "0.2"
portable-pty = "0.9.0"
ratatui = { version = "0.30.0", default-features = false, features = ["std", "crossterm_0_29"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt", "sync", "time"] }
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
clap = { version = "4.6.1", features = ["derive"] }
crossterm = "0.29"
nmux-proto = { path = "crates/nmux-proto" }
nmux-core = { path = "crates/nmux-core", default-features = false }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"
